<style>
  :root{
    --bg:#F7F8FA;
    --card:#FFFFFF;
    --ink:#0D1117;
    --ink2:#3D4550;
    --muted:#8892A0;
    --line:#E8ECF0;
    --line2:#F0F3F6;
    --verde:#0B6E4F;
    --verde-mid:#0D855F;
    --verde-suave:#E0F5EC;
    --verde-ring:#7DCBA8;
    --azul:#1450A0;
    --azul-suave:#DDE9FA;
    --rojo:#B93333;
    --rojo-suave:#FCEAEA;
    --mono:'Spline Sans Mono',monospace;
    --sans:'Inter',sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{overscroll-behavior-x:none}
  body{
    font-family:'Schibsted Grotesk',sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;
    min-height:100dvh;padding-bottom:110px;
    overscroll-behavior-y:contain;
  }

  /* ══ HEADER ══════════════════════════════════════════ */
  .top-sticky{
    position:sticky;top:0;z-index:20;
    background:#fff;
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 16px rgba(0,0,0,.05);
    padding-top:env(safe-area-inset-top);
  }
  .hd-inner{
    padding:14px 18px 10px;
    display:flex;align-items:center;gap:0;
  }
  /* Bloque izquierdo: título + total */
  .hd-brand{
    flex:1;display:flex;flex-direction:column;gap:1px;
  }
  h1{
    font-family:var(--sans);font-size:18px;font-weight:800;
    letter-spacing:-.03em;color:var(--ink);
    line-height:1;flex:1;
  }
  .progreso{display:none}
  .btn-limpiar{display:none}
  .btn-lista-final{display:none}

  /* Badge de cantidad */
  .qty-badge{
    flex:none;
    font-family:var(--mono);font-size:22px;font-weight:800;
    color:#fff;background:var(--rojo);
    min-width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    padding:0 8px;letter-spacing:-.02em;
    box-shadow:0 2px 6px rgba(168,36,36,.35);
    cursor:pointer;
  }

  /* Selector +/− dentro del modal */
  .qty-selector{
    display:flex;align-items:center;justify-content:center;
    gap:0;margin:4px 0 0;
  }
  .qty-btn{
    width:56px;height:56px;border:none;border-radius:14px;
    font-size:28px;font-weight:300;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .1s,transform .08s;
    -webkit-appearance:none;appearance:none;
  }
  .qty-menos{background:var(--rojo-suave);color:var(--rojo)}
  .qty-menos:active{background:#f5d0d0;transform:scale(.93)}
  .qty-mas{background:var(--verde-suave);color:var(--verde)}
  .qty-mas:active{background:#b8e8d0;transform:scale(.93)}
  .qty-num{
    font-family:var(--mono);font-size:44px;font-weight:800;
    color:var(--ink);letter-spacing:-.04em;
    min-width:90px;text-align:center;line-height:1;
  }

  /* ── Buscador ── */
  .search-wrap{
    padding:10px 18px 14px;
    position:relative;
  }
  .search-box-wrap{
    position:relative;
  }
  .search-box{
    display:flex;align-items:center;gap:10px;
    background:var(--bg);border:1.5px solid var(--line);
    border-radius:14px;padding:12px 16px;
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .search-box:focus-within{
    border-color:var(--verde);background:#fff;
    box-shadow:0 0 0 3px rgba(11,110,79,.1);
  }
  .search-icon{
    flex:none;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;
    opacity:.45;
  }
  .search-icon svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #inpBuscar{
    border:none;background:transparent;
    font-family:var(--sans);font-size:16px;font-weight:500;
    color:var(--ink);flex:1;outline:none;min-width:0;
  }
  #inpBuscar::placeholder{color:var(--muted);font-weight:400}
  .search-clear{
    flex:none;border:none;background:var(--line2);
    color:var(--muted);font-size:12px;font-weight:700;
    width:22px;height:22px;border-radius:50%;
    cursor:pointer;display:none;
    align-items:center;justify-content:center;
    transition:background .12s;
  }
  .search-clear.visible{display:flex}
  .search-clear:active{background:var(--line)}

  /* ── Sugerencias de búsqueda ── */
  .search-suggestions{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:25;
    background:#fff;border-radius:16px;
    border:1.5px solid var(--line);
    box-shadow:0 8px 32px rgba(0,0,0,.1);
    overflow:hidden;
    max-height:280px;overflow-y:auto;
  }
  .search-suggestions[hidden]{display:none}
  .sug-item{
    display:flex;align-items:center;gap:10px;
    padding:13px 16px;cursor:pointer;
    border-bottom:1px solid var(--line2);
    transition:background .1s;
  }
  .sug-item:last-child{border-bottom:none}
  .sug-item:active{background:var(--bg)}
  .sug-nombre{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);flex:1}
  .sug-cat{
    font-family:var(--mono);font-size:10px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;
    padding:3px 9px;border-radius:6px;white-space:nowrap;
  }
  .sug-estado{font-size:13px;flex:none}

  /* Botón recordatorio — oculto en header, en dock */
  .btn-recordatorio{display:none}

  /* ── Franja de pendientes — oculta (pantalla inicio sin lista) ── */
  .pending-bar{display:none!important}
  .pending-label{
    font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .pending-pills{display:flex;flex-wrap:wrap;gap:6px}
  .pending-pill{
    flex:none;font-family:inherit;font-size:11px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;
    padding:5px 13px;border-radius:20px;border:1.5px solid transparent;
    cursor:pointer;white-space:nowrap;
    background:var(--verde-suave);color:var(--verde);border-color:var(--verde-ring);
    display:flex;align-items:center;gap:6px;
    transition:opacity .12s,transform .1s;
  }
  .pending-pill:active{opacity:.75;transform:scale(.96)}
  .pending-pill .badge{
    background:var(--verde);color:#fff;
    border-radius:10px;padding:1px 7px;font-size:10px;font-weight:800;
  }

  /* ── Carrusel de todas las categorías: ver .all-cats-inner en sección ALTA ── */
  .cat-btn{
    flex:none;font-family:inherit;font-size:11px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;
    padding:5px 13px;border-radius:20px;border:1.5px solid transparent;
    cursor:pointer;white-space:nowrap;min-height:30px;
    transition:opacity .12s,transform .1s,box-shadow .12s;
  }
  .cat-btn:active{opacity:.75;transform:scale(.96)}
  .cat-btn.activa{box-shadow:0 0 0 2px var(--ink)}

  /* ══ MAIN — oculto en inicio, solo Bitácora lo usa ══ */
  main{display:none}
  .estado-app{display:none;text-align:center;padding:32px 20px;font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer}
  .no-resultados{text-align:center;padding:40px 20px;font-size:14px;color:var(--muted)}

  .categoria{margin-bottom:22px}
  .cat-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px}
  .cat-pill{
    font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 12px;border-radius:20px;border:1.5px solid transparent;
  }
  .cat-n{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}

  .grupo{
    background:var(--card);border-radius:var(--r);overflow:hidden;
    border:1.5px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04);
  }

  /* ── Items ── */
  .item{
    display:flex;flex-direction:column;
    padding:12px 12px 10px;border-bottom:1.5px solid var(--line2);
    gap:7px;transition:background .1s;
  }
  .item:last-child{border-bottom:none}
  .item.catalogo{background:var(--card)}
  .item.catalogo .nombre{color:var(--ink2);font-weight:500}
  .item.pendiente{background:#FAFCF8}
  .item.ok{background:#F5FBF7}
  .item.ok .nombre{
    color:var(--muted);text-decoration:line-through;
    text-decoration-thickness:1.5px;text-decoration-color:var(--verde-ring);font-weight:400;
  }

  .item-top{display:flex;align-items:flex-start;gap:9px}
  .item-bottom{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-left:41px}

  .check{
    flex:none;width:30px;height:30px;border-radius:50%;
    border:2px solid var(--line);background:transparent;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:transparent;cursor:pointer;margin-top:2px;
    -webkit-tap-highlight-color:transparent;
    transition:all .18s cubic-bezier(.4,0,.2,1);
  }
  .item.pendiente .check{border-color:var(--verde-ring)}
  .item.ok .check{background:var(--verde);border-color:var(--verde);color:#fff;box-shadow:0 2px 8px rgba(26,122,71,.25)}

  .info{flex:1;min-width:0}
  .nombre-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .nombre{font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
  .precio-ref{
    font-family:var(--mono);font-size:11px;font-weight:600;
    color:var(--muted);background:var(--line2);
    padding:2px 7px;border-radius:6px;white-space:nowrap;
  }
  /* Historial de precios */
  .precio-hist{
    display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap;
  }
  .hist-label{
    font-family:var(--mono);font-size:9px;font-weight:700;
    color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
  }
  .hist-item{
    font-family:var(--mono);font-size:13px;font-weight:500;
    color:#AAB0A8;
    text-decoration:line-through;text-decoration-color:#C8CCC6;
  }
  .hist-arrow{
    font-size:10px;color:#C8CCC6;
  }
  .hist-delta{
    font-family:var(--mono);font-size:11px;font-weight:700;
    padding:2px 7px;border-radius:6px;
  }
  .hist-delta.sube{background:#FEE8E8;color:var(--rojo)}
  .hist-delta.baja{background:var(--verde-suave);color:var(--verde)}
  .hist-delta.igual{background:var(--line2);color:var(--muted)}
  .sub{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
  .cat-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
  .cat-lbl.vacia{color:#C4CAC2;font-style:italic;text-transform:none;letter-spacing:0}

  .info-actions{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .btn-inline{
    font-family:inherit;font-size:11px;font-weight:600;
    color:var(--muted);background:transparent;
    border:1px dashed var(--line);border-radius:6px;
    padding:3px 9px;cursor:pointer;transition:all .12s;white-space:nowrap;
  }
  .btn-inline:active{background:var(--line2);color:var(--ink)}

  .chip-lista{
    flex:none;font-family:var(--mono);font-size:11px;font-weight:600;
    color:var(--azul);background:var(--azul-suave);
    padding:3px 8px;border-radius:6px;white-space:nowrap;
  }
  .chip-fecha{
    flex:none;font-family:var(--mono);font-size:11px;font-weight:600;
    color:var(--verde);background:var(--verde-suave);
    padding:3px 8px;border-radius:6px;white-space:nowrap;
  }

  /* Campo precio: label + $ fuera del recuadro */
  .precio-wrap{
    display:flex;align-items:center;gap:5px;flex:none;
  }
  .precio-lbl{
    font-family:var(--mono);font-size:11px;font-weight:700;
    color:var(--muted);letter-spacing:.04em;text-transform:uppercase;
  }
  .precio-signo{
    font-family:var(--mono);font-size:14px;font-weight:700;color:var(--muted);
  }
  .valor-display{
    font-family:var(--mono);font-size:15px;font-weight:600;
    min-width:72px;text-align:right;
    border:1.5px solid var(--line);border-radius:8px;
    padding:6px 10px;background:var(--bg);color:var(--ink);
    cursor:pointer;transition:border-color .15s,box-shadow .15s;
  }
  .valor-display:active{border-color:var(--verde-mid);box-shadow:0 0 0 3px var(--verde-suave)}
  .valor-display.vacio{color:var(--muted);font-weight:400;font-size:13px}
  .valor-display.historico{color:var(--muted);background:transparent;border-style:dashed}

  /* ── Teclado numérico popup ── */
  .numpad-overlay{
    position:fixed;inset:0;z-index:85;
    background:rgba(0,0,0,.35);
    display:flex;align-items:flex-end;justify-content:center;
    backdrop-filter:blur(2px);
  }
  .numpad-overlay[hidden]{display:none}
  .numpad-card{
    background:var(--card);border-radius:20px 20px 0 0;
    width:100%;max-width:420px;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.15);
  }
  .numpad-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
  }
  .numpad-producto{font-size:13px;font-weight:600;color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .numpad-display{
    font-family:var(--mono);font-size:32px;font-weight:700;
    color:var(--ink);letter-spacing:-.02em;text-align:right;
    background:var(--bg);border-radius:10px;
    padding:10px 16px;margin-bottom:12px;
    min-height:56px;display:flex;align-items:center;justify-content:flex-end;
  }
  .numpad-prefix{font-size:16px;color:var(--muted);margin-right:4px;font-weight:500}
  .numpad-val{flex:1;text-align:right}
  .numpad-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  }
  .nk{
    font-family:inherit;font-size:20px;font-weight:600;
    background:var(--line2);color:var(--ink);
    border:none;border-radius:12px;
    height:58px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .1s,transform .08s;
    -webkit-tap-highlight-color:transparent;
  }
  .nk:active{background:var(--line);transform:scale(.94)}
  .nk.borrar{background:var(--rojo-suave);color:var(--rojo);font-size:18px}
  .nk.ok{background:var(--verde);color:#fff;font-size:16px;font-weight:700;letter-spacing:.04em}
  .nk.ok:active{background:var(--verde-mid)}
  .nk.limpiar{background:var(--line2);color:var(--muted);font-size:13px;font-weight:700}

  .btn-comprar{
    flex:none;font:inherit;font-size:11px;font-weight:700;
    color:var(--verde);background:var(--verde-suave);
    border:1.5px solid var(--verde-ring);border-radius:8px;
    padding:7px 12px;cursor:pointer;letter-spacing:.05em;
    text-transform:uppercase;white-space:nowrap;min-height:34px;
    transition:background .12s;
  }
  .btn-comprar:active{background:var(--verde-ring);color:#fff}

  .btn-sacar{
    flex:none;width:34px;height:34px;border-radius:50%;
    border:none;background:transparent;color:var(--muted);
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s;
  }
  .btn-sacar:active{background:var(--line)}

  /* Botón "Volver a comprar" — solo en estado ✓ */
  .btn-recomprar{
    flex:none;font:inherit;font-size:10px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;
    color:var(--azul);background:var(--azul-suave);
    border:1.5px solid #B8D0F5;border-radius:8px;
    padding:5px 10px;cursor:pointer;white-space:nowrap;
    transition:background .12s;
  }
  .btn-recomprar:active{background:#C8DCFF}

  .btn-eliminar{
    flex:none;width:34px;height:34px;border-radius:50%;
    border:none;background:transparent;color:#D4CCCC;
    font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s,color .12s;
  }
  .btn-eliminar:active{background:var(--rojo-suave);color:var(--rojo)}

  /* ══ DOCK INFERIOR ═══════════════════════════════════ */
  .alta{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .alta-btns{
    display:grid;
    grid-template-columns:1fr auto auto auto;
    gap:8px;
  }
  .btn-crear{
    height:52px;border:none;border-radius:14px;
    background:var(--verde);color:#fff;
    font-family:var(--sans);font-size:15px;font-weight:700;
    letter-spacing:-.01em;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 4px 16px rgba(11,110,79,.3);
    transition:background .12s,transform .1s,box-shadow .12s;
    -webkit-appearance:none;appearance:none;
  }
  .btn-crear:active{background:var(--verde-mid);transform:scale(.97);box-shadow:0 2px 8px rgba(11,110,79,.2)}
  .btn-crear-icon{
    width:22px;height:22px;border-radius:50%;
    background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:400;line-height:1;
  }
  /* Botones secundarios del dock: cuadrados, iguales */
  .dock-btn{
    width:52px;height:52px;border-radius:14px;
    border:1.5px solid var(--line);background:var(--bg);
    color:var(--ink2);
    cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    transition:background .12s,border-color .12s,transform .1s;
    -webkit-appearance:none;appearance:none;
    flex:none;
  }
  .dock-btn:active{background:#fff;border-color:var(--verde);transform:scale(.95)}
  .dock-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .dock-btn span{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
  .btn-ver-lista{} /* alias para compatibilidad con JS */

  /* ══ MODAL CREAR ════════════════════════════════════ */
  .modal-crear{
    position:fixed;inset:0;z-index:45;
    background:rgba(0,0,0,.45);
    display:flex;align-items:flex-end;justify-content:center;
    backdrop-filter:blur(5px);
  }
  .modal-crear[hidden]{display:none}
  .modal-crear-card{
    background:var(--card);border-radius:22px 22px 0 0;
    width:100%;max-width:520px;
    padding:20px 18px calc(22px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.2);
  }
  .mc-drag{
    width:40px;height:4px;border-radius:2px;
    background:var(--line);margin:0 auto 16px;
  }
  .mc-titulo{
    font-size:18px;font-weight:700;color:var(--ink);
    margin-bottom:14px;
  }
  .mc-step{
    display:flex;flex-direction:column;gap:12px;
  }
  .mc-step[hidden]{display:none}
  .mc-label{
    font-size:11px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin-bottom:4px;
  }
  .mc-input{
    width:100%;font-family:inherit;font-size:16px;
    border:1.5px solid var(--line);border-radius:11px;
    padding:13px 14px;background:var(--bg);color:var(--ink);
    outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .mc-input:focus{border-color:var(--verde-mid);background:#fff;box-shadow:0 0 0 3px var(--verde-suave)}
  .mc-chips{
    display:flex;flex-wrap:wrap;gap:7px;
  }
  .mc-chip{
    font-family:inherit;font-size:12px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;
    padding:7px 14px;border-radius:20px;border:1.5px solid transparent;
    cursor:pointer;white-space:nowrap;
    transition:transform .1s,box-shadow .1s,opacity .12s;
    -webkit-appearance:none;appearance:none;
  }
  .mc-chip:active{transform:scale(.95);opacity:.8}
  .mc-chip.seleccionada{
    box-shadow:0 0 0 2.5px var(--ink);
    transform:scale(1.04);
  }
  .mc-nueva-wrap{
    display:flex;gap:7px;align-items:center;
    margin-top:2px;
  }
  .mc-nueva-input{
    flex:1;font-family:inherit;font-size:15px;
    border:1.5px dashed var(--line);border-radius:10px;
    padding:10px 12px;background:var(--bg);color:var(--ink);
    outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .mc-nueva-input:focus{border-color:var(--verde-mid);background:#fff;box-shadow:0 0 0 3px var(--verde-suave);border-style:solid}
  .mc-nueva-input::placeholder{color:var(--muted);font-style:italic}
  .mc-btns{
    display:flex;gap:8px;margin-top:6px;
  }
  .mc-btns button{
    flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--line);
    background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:500;
    cursor:pointer;transition:background .12s;
  }
  .mc-btns button:active{background:var(--line2)}
  .mc-sig{
    width:100%;padding:14px;border-radius:12px;border:none;
    background:var(--verde);color:#fff;
    font:inherit;font-size:15px;font-weight:700;
    cursor:pointer;
    transition:background .12s;
    -webkit-appearance:none;
  }
  .mc-sig:active{background:var(--verde-mid)}
  .mc-sig:disabled{opacity:.4;pointer-events:none}
  .mc-nombre-recap{
    font-size:14px;font-weight:600;color:var(--ink2);
    background:var(--line2);border-radius:9px;
    padding:10px 13px;margin-bottom:2px;
    display:flex;align-items:center;gap:7px;
  }
  .mc-nombre-recap .recap-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:none}

  .estado-app{text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);padding:24px 0}

  /* ══ PANEL LISTA FINAL ══════════════════════════════ */
  .panel-lista{
    position:fixed;inset:0;z-index:55;
    background:var(--bg);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  .panel-lista[hidden]{display:none}
  .pl-header{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px 12px;
    background:#fff;border-bottom:1.5px solid var(--line);
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    flex:none;
  }
  .pl-titulo{
    flex:1;font-size:16px;font-weight:700;color:var(--ink);
  }
  .pl-subtitulo{
    font-family:var(--mono);font-size:12px;font-weight:600;
    background:var(--verde-suave);color:var(--verde);
    padding:3px 10px;border-radius:20px;flex:none;
  }
  .pl-cerrar{
    flex:none;width:36px;height:36px;border:none;border-radius:50%;
    background:var(--line2);color:var(--ink2);
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s;
  }
  .pl-cerrar:active{background:var(--line)}
  .pl-filtros-wrap{
    flex:none;
    background:#fff;
    border-bottom:1.5px solid var(--line);
    padding:10px 14px;
  }
  .pl-filtros{
    display:flex;gap:7px;
    overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .pl-filtros::-webkit-scrollbar{display:none}
  .pl-chip{
    flex:none;
    display:flex;align-items:center;gap:5px;
    font-family:inherit;font-size:12px;font-weight:700;
    letter-spacing:.04em;
    padding:6px 14px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:var(--bg);color:var(--muted);
    cursor:pointer;white-space:nowrap;
    transition:all .15s;
    -webkit-appearance:none;appearance:none;
  }
  .pl-chip.activo{
    background:var(--ink);color:#fff;border-color:var(--ink);
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .pl-chip.activo.chip-todo{
    background:var(--verde);border-color:var(--verde);
    box-shadow:0 2px 8px rgba(26,122,71,.3);
  }
  .pl-chip-count{
    font-size:10px;font-weight:800;
    background:rgba(255,255,255,.25);
    border-radius:10px;padding:1px 6px;
    line-height:1.4;
  }
  .pl-chip:not(.activo) .pl-chip-count{
    background:var(--line);color:var(--ink2);
  }
  .pl-body{
    flex:1;overflow-y:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom));
  }
  .pl-vacia{
    text-align:center;padding:60px 20px;font-size:14px;color:var(--muted);
  }
  .pl-sep{
    display:flex;align-items:center;gap:8px;
    margin:10px 0 6px;
  }
  .pl-sep:first-child{
    margin-top:2px;
  }
  .pl-sep-lbl{
    font-family:var(--mono);font-size:10px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    flex:none;white-space:nowrap;
  }
  .pl-sep-line{
    flex:1;border:none;border-top:1.5px dashed var(--line);
    height:0;
  }
  .pl-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 12px;
    background:#fff;border-radius:10px;margin-bottom:5px;
    border:1.5px solid var(--line);
    transition:opacity .2s,background .15s;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .pl-item.comprado{
    opacity:.5;background:var(--bg);
  }
  .pl-check{
    flex:none;width:24px;height:24px;border-radius:50%;
    border:2px solid var(--verde-ring);background:transparent;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:transparent;
    transition:all .18s cubic-bezier(.4,0,.2,1);
  }
  .pl-item.comprado .pl-check{
    background:var(--verde);border-color:var(--verde);color:#fff;
    box-shadow:0 2px 8px rgba(26,122,71,.25);
  }
  .pl-info{flex:1;min-width:0}
  .pl-nombre{
    font-size:14px;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pl-item.comprado .pl-nombre{
    text-decoration:line-through;text-decoration-color:var(--verde-ring);color:var(--muted);
  }
  .pl-qty{
    flex:none;font-family:var(--mono);font-size:13px;font-weight:700;
    color:#fff;background:var(--rojo);
    min-width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    padding:0 6px;
  }
  .pl-qty.uno{display:none}
  .pl-precio-wrap{
    flex:none;display:flex;align-items:center;gap:5px;
  }
  .pl-valor{
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink2);
  }
  .pl-delta{
    font-family:var(--mono);font-size:10px;font-weight:700;
    padding:2px 6px;border-radius:5px;
  }
  .pl-delta.sube{background:#FEE8E8;color:var(--rojo)}
  .pl-delta.baja{background:var(--verde-suave);color:var(--verde)}
  .pl-delta.igual{background:var(--line2);color:var(--muted)}
  #mpValor:focus{outline:none;border-color:var(--verde-mid)!important;background:#fff!important;box-shadow:0 0 0 3px var(--verde-suave)!important}

  /* ══ MODALES ════════════════════════════════════════ */
  .modal,.modal-confirm{
    position:fixed;inset:0;z-index:80;
    background:rgba(0,0,0,.4);
    display:flex;align-items:flex-end;justify-content:center;
    padding:16px;backdrop-filter:blur(4px);
  }
  .modal-confirm{z-index:90}
  .modal[hidden],.modal-confirm[hidden]{display:none}
  .modal-card,.modal-confirm .card{
    background:var(--card);border-radius:18px;
    width:100%;max-width:480px;padding:20px;
    box-shadow:0 12px 40px rgba(0,0,0,.15);
  }
  .m-tag{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}
  .m-nombre{font-size:18px;font-weight:700;margin-bottom:14px}
  .modal-card input{
    width:100%;font-family:inherit;font-size:16px;
    border:1.5px solid var(--line);border-radius:10px;
    padding:13px;background:var(--bg);color:var(--ink);
    margin-bottom:14px;transition:border-color .15s,box-shadow .15s;
  }
  .modal-card input:focus{outline:none;border-color:var(--verde-mid);background:#fff;box-shadow:0 0 0 3px var(--verde-suave)}
  .m-btns{display:flex;gap:8px}
  .m-btns button{
    flex:1;padding:13px;border-radius:11px;border:1.5px solid var(--line);
    background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer;
    transition:background .12s;
  }
  .m-btns button:active{background:var(--line2)}
  .primario{background:var(--verde) !important;color:#fff !important;border-color:var(--verde) !important}
  .primario:active{background:var(--verde-mid) !important}
  .modal-confirm .aviso{font-size:10px;font-weight:700;color:var(--rojo);letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}
  .modal-confirm .item-nombre{font-size:18px;font-weight:700;margin-bottom:5px}
  .modal-confirm .item-warn{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.55}
  .peligro{background:var(--rojo) !important;color:#fff !important;border-color:var(--rojo) !important}
  .peligro:active{background:#8A1A1A !important}

  /* ══ PANEL BITÁCORA ═════════════════════════════════ */
  .panel-bitacora{
    position:fixed;inset:0;z-index:55;
    background:var(--bg);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  .panel-bitacora[hidden]{display:none}
  .pb-header{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px 12px;
    background:#fff;border-bottom:1.5px solid var(--line);
    box-shadow:0 2px 10px rgba(0,0,0,.06);flex:none;
  }
  .pb-titulo{flex:1;font-size:16px;font-weight:700;color:var(--ink)}
  .pb-subtitulo{
    font-family:var(--mono);font-size:12px;font-weight:600;
    background:var(--line2);color:var(--muted);
    padding:3px 10px;border-radius:20px;flex:none;
  }
  .pb-limpiar{
    flex:none;font-family:var(--sans);font-size:11px;font-weight:600;
    background:transparent;color:var(--muted);
    border:1.5px solid var(--line);border-radius:8px;
    padding:6px 11px;cursor:pointer;white-space:nowrap;
    transition:all .12s;
  }
  .pb-limpiar:active{background:var(--rojo-suave);color:var(--rojo);border-color:var(--rojo)}
  .pb-limpiar:disabled{opacity:.3;pointer-events:none}
  .pb-cerrar{
    flex:none;width:36px;height:36px;border:none;border-radius:50%;
    background:var(--line2);color:var(--ink2);
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s;
  }
  .pb-cerrar:active{background:var(--line)}
  .pb-body{
    flex:1;overflow-y:auto;
    padding:14px 14px calc(20px + env(safe-area-inset-bottom));
  }
  .pb-cat-hdr{
    display:flex;align-items:center;gap:8px;
    margin:6px 0 6px;padding:0 2px;
  }
  .pb-cat-hdr:first-child{margin-top:0}
  .pb-cat-pill{
    font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 12px;border-radius:20px;border:1.5px solid transparent;
  }
  .pb-cat-n{
    font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;
  }
  .pb-grupo{
    background:var(--card);border-radius:var(--r);overflow:hidden;
    border:1.5px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04);
    margin-bottom:18px;
  }
  .pb-item{
    display:flex;align-items:center;gap:10px;
    padding:12px 12px 11px;
    border-bottom:1.5px solid var(--line2);
    transition:background .1s;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .pb-item:last-child{border-bottom:none}
  .pb-item:active{background:var(--bg)}
  .pb-item-info{flex:1;min-width:0}
  .pb-nombre{
    font-size:15px;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pb-precio-row{
    display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;
  }
  .pb-precio-actual{
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink2);
  }
  .pb-precio-hist{
    font-family:var(--mono);font-size:11px;color:#BBBFBB;
    text-decoration:line-through;text-decoration-color:#D8DCD6;
  }
  .pb-delta{
    font-family:var(--mono);font-size:10px;font-weight:700;
    padding:1px 5px;border-radius:4px;
  }
  .pb-delta.sube{background:#FEE8E8;color:var(--rojo)}
  .pb-delta.baja{background:var(--verde-suave);color:var(--verde)}
  .pb-item-estado{
    flex:none;
    font-family:var(--mono);font-size:10px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;
    padding:4px 9px;border-radius:6px;
  }
  .pb-item-estado.pendiente{background:var(--azul-suave);color:var(--azul)}

  /* ══ ACTION SHEET ════════════════════════════════════ */
  .action-sheet{
    position:fixed;inset:0;z-index:70;
    background:rgba(0,0,0,.4);
    display:flex;align-items:flex-end;justify-content:center;
    backdrop-filter:blur(3px);
  }
  .action-sheet[hidden]{display:none}
  .as-card{
    background:var(--card);border-radius:20px 20px 0 0;
    width:100%;max-width:480px;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.15);
  }
  .as-drag{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .as-nombre{
    font-size:16px;font-weight:700;color:var(--ink);
    padding:0 4px 12px;border-bottom:1px solid var(--line);margin-bottom:8px;
  }
  .as-btn{
    width:100%;text-align:left;
    font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);
    background:transparent;border:none;border-radius:12px;
    padding:14px 12px;cursor:pointer;
    display:flex;align-items:center;gap:12px;
    transition:background .1s;
  }
  .as-btn:active{background:var(--bg)}
  .as-btn svg{flex:none;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .as-btn.verde{color:var(--verde)}
  .as-btn.rojo{color:var(--rojo)}
  .as-sep{height:1px;background:var(--line);margin:4px 0}
  .as-cancelar{
    width:100%;font-family:inherit;font-size:15px;font-weight:600;
    background:var(--bg);color:var(--muted);
    border:none;border-radius:14px;padding:15px;
    cursor:pointer;margin-top:8px;transition:background .1s;
  }
  .as-cancelar:active{background:var(--line)}
</style>

<div class="top-sticky">
  <div class="hd-inner">
    <h1>Super</h1>
    <button type="button" class="btn-lista-final" id="btnListaFinal" title="Ver lista final" hidden></button>
  </div>

  <div class="search-wrap">
    <div class="search-box-wrap">
      <div class="search-box">
        <span class="search-icon">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input id="inpBuscar" type="search" placeholder="Buscar producto…" autocomplete="off" autocorrect="off">
        <button type="button" class="search-clear" id="btnSearchClear">✕</button>
      </div>
      <div class="search-suggestions" id="searchSuggestions" hidden></div>
    </div>
    <button type="button" class="btn-recordatorio" id="btnRecordatorio">
      🔔<br>Aviso
    </button>
  </div>

</div>

<main id="lista"></main>
<div class="estado-app" id="estadoApp">Cargando…</div>

<!-- Modal confirmar eliminar -->
<div class="modal-confirm" id="modalConfirm" hidden>
  <div class="card">
    <div class="aviso">Eliminar producto</div>
    <div class="item-nombre" id="confirmNombre"></div>
    <div class="item-warn">Se borrará de la lista y del sheet permanentemente.</div>
    <div class="acciones m-btns">
      <button id="confirmCancelar">Cancelar</button>
      <button id="confirmEliminar" class="peligro">Eliminar</button>
    </div>
  </div>
</div>

<!-- Modal editar categoría -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="m-tag">Categoría</div>
    <div class="m-nombre" id="modalProducto"></div>
    <input id="modalInput" list="cats" placeholder="Elegí existente o escribí nueva" autocomplete="off">
    <div class="m-btns">
      <button id="modalCancelar">Cancelar</button>
      <button id="modalGuardar" class="primario">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal editar nombre -->
<div class="modal" id="modalNombre" hidden>
  <div class="modal-card">
    <div class="m-tag">Editar nombre</div>
    <div class="m-nombre" id="modalNombreActual"></div>
    <input id="modalNombreInput" type="text" placeholder="Nuevo nombre" autocomplete="off">
    <div class="m-btns">
      <button id="modalNombreCancelar">Cancelar</button>
      <button id="modalNombreGuardar" class="primario">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal cantidad -->
<div class="modal" id="modalCantidad" hidden>
  <div class="modal-card">
    <div class="m-tag">¿Cuánto necesitás?</div>
    <div class="m-nombre" id="modalCantidadNombre"></div>
    <div class="qty-selector">
      <button type="button" class="qty-btn qty-menos" id="qtyMenos">−</button>
      <span class="qty-num" id="qtyNum">1</span>
      <button type="button" class="qty-btn qty-mas" id="qtyMas">+</button>
    </div>
    <div class="m-btns" style="margin-top:18px">
      <button id="modalCantidadCancelar">Cancelar</button>
      <button id="modalCantidadOk" class="primario">Confirmar</button>
    </div>
  </div>
</div>

<!-- Teclado numérico -->
<div class="numpad-overlay" id="numpadOverlay" hidden>
  <div class="numpad-card">
    <div class="numpad-header">
      <span class="numpad-producto" id="numpadProducto"></span>
    </div>
    <div class="numpad-display">
      <span class="numpad-prefix">$</span>
      <span class="numpad-val" id="numpadVal">—</span>
    </div>
    <div class="numpad-grid">
      <button class="nk" data-k="7">7</button>
      <button class="nk" data-k="8">8</button>
      <button class="nk" data-k="9">9</button>
      <button class="nk" data-k="4">4</button>
      <button class="nk" data-k="5">5</button>
      <button class="nk" data-k="6">6</button>
      <button class="nk" data-k="1">1</button>
      <button class="nk" data-k="2">2</button>
      <button class="nk" data-k="3">3</button>
      <button class="nk limpiar" data-k="C">Limpiar</button>
      <button class="nk" data-k="0">0</button>
      <button class="nk borrar" data-k="⌫">⌫</button>
      <button class="nk ok" data-k="OK" style="grid-column:1/-1">Guardar precio</button>
    </div>
  </div>
</div>

<datalist id="cats"></datalist>

<!-- Panel Bitácora -->
<div class="panel-bitacora" id="panelBitacora" hidden>
  <div class="pb-header">
    <div class="pb-titulo">📒 Bitácora</div>
    <div class="pb-subtitulo" id="pbContador">0 productos</div>
    <button type="button" class="pb-limpiar" id="btnLimpiarBitacora" title="Pasar comprados a catálogo">↩ Limpiar</button>
    <button type="button" class="pb-cerrar" id="btnCerrarBitacora">✕</button>
  </div>
  <div class="pb-body" id="pbBody"></div>
</div>

<!-- Action sheet (Bitácora) -->
<div class="action-sheet" id="actionSheet" hidden>
  <div class="as-card">
    <div class="as-drag"></div>
    <div class="as-nombre" id="asNombre"></div>
    <button type="button" class="as-btn verde" id="asBtnPendiente">
      <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Agregar a lista de compras
    </button>
    <button type="button" class="as-btn" id="asBtnRenombrar">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Editar nombre
    </button>
    <button type="button" class="as-btn" id="asBtnCategoria">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Cambiar categoría
    </button>
    <div class="as-sep"></div>
    <button type="button" class="as-btn rojo" id="asBtnEliminar">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      Eliminar producto
    </button>
    <button type="button" class="as-cancelar" id="asCancelar">Cancelar</button>
  </div>
</div>

<!-- Panel Lista Final -->
<div class="panel-lista" id="panelLista" hidden>
  <div class="pl-header">
    <div class="pl-titulo">🛒 Lista final</div>
    <div class="pl-subtitulo" id="plContador">0 productos</div>
    <button type="button" class="pl-cerrar" id="btnCerrarLista">✕</button>
  </div>
  <div class="pl-filtros-wrap" id="plFiltrosWrap">
    <div class="pl-filtros" id="plFiltros"></div>
  </div>
  <div class="pl-body" id="plBody"></div>
</div>

<!-- Modal precio (desde Lista Final) -->
<div class="modal" id="modalPrecio" hidden style="z-index:82">
  <div class="modal-card">
    <div class="m-tag">Registrar precio</div>
    <div class="m-nombre" id="mpNombre"></div>
    <div style="position:relative;margin-bottom:14px">
      <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:16px;font-weight:700;color:var(--muted)">$</span>
      <input id="mpValor" type="number" inputmode="decimal" placeholder="0" min="0" step="any"
        style="padding-left:28px;width:100%;font-family:var(--mono);font-size:22px;font-weight:700;
               border:1.5px solid var(--line);border-radius:10px;padding:13px 13px 13px 28px;
               background:var(--bg);color:var(--ink);transition:border-color .15s,box-shadow .15s">
    </div>
    <div class="m-btns">
      <button id="mpOmitir">Omitir</button>
      <button class="primario" id="mpConfirmar">✓ Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal crear producto -->
<div class="modal-crear" id="modalCrear" hidden>
  <div class="modal-crear-card">
    <div class="mc-drag"></div>

    <!-- Paso 1: nombre -->
    <div class="mc-step" id="mcStep1">
      <div class="mc-titulo">Crear producto</div>
      <div>
        <div class="mc-label">Nombre del producto</div>
        <input class="mc-input" id="mcNombre" type="text" placeholder="Ej: Aceite de oliva" autocomplete="off" autocorrect="off">
      </div>
      <div class="mc-btns">
        <button id="mcCancelar1">Cancelar</button>
        <button class="mc-sig" id="mcSiguiente" disabled>Siguiente →</button>
      </div>
    </div>

    <!-- Paso 2: categoría -->
    <div class="mc-step" id="mcStep2" hidden>
      <div class="mc-titulo">Elegí una categoría</div>
      <div class="mc-nombre-recap">
        <span class="recap-lbl">Producto</span>
        <span id="mcNombreRecap"></span>
      </div>
      <div class="mc-chips" id="mcChips"></div>
      <div>
        <div class="mc-label" style="margin-bottom:6px">O escribí una nueva</div>
        <input class="mc-nueva-input" id="mcNuevaCat" type="text" placeholder="Nueva categoría…" autocomplete="off" autocorrect="off">
      </div>
      <div class="mc-btns">
        <button id="mcVolver">← Volver</button>
        <button class="mc-sig" id="mcGuardar">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="alta">
  <div class="alta-btns">
    <button type="button" class="btn-crear" id="btnCrear">
      <span class="btn-crear-icon">+</span>
      Crear producto
    </button>
    <button type="button" class="dock-btn btn-ver-lista" id="btnVerLista" aria-label="Ver lista">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Lista</span>
    </button>
    <button type="button" class="dock-btn" id="btnBitacora" aria-label="Bitácora">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg>
      <span>Bitácora</span>
    </button>
    <button type="button" class="dock-btn" id="btnRecordatorio2" aria-label="Enviar aviso">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>Aviso</span>
    </button>
  </div>
</div>
